<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ביס ראשון</title>
  <meta name="description" content="מעקב טעימות וחשיפה לאלרגנים לתינוקות">
  <meta name="theme-color" content="#ff9f80">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon.svg">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="bg-blobs" aria-hidden="true"><span></span><span></span><span></span></div>

  <header class="topbar">
    <div class="brand">
      <span class="brand-logo">🥄</span>
      <div>
        <h1>ביס ראשון</h1>
        <p id="babyLine" class="sub"></p>
      </div>
    </div>
    <button class="icon-btn" id="settingsBtn" aria-label="הגדרות">⚙️</button>
  </header>

  <main id="view" class="view" tabindex="-1"></main>

  <nav class="tabbar" aria-label="ניווט ראשי">
    <button data-tab="home" class="active"><span>🏠</span>בית</button>
    <button data-tab="foods"><span>🥕</span>מוצרים</button>
    <button data-tab="allergens"><span>⭐</span>אלרגנים</button>
    <button data-tab="recipes"><span>🍲</span>מתכונים</button>
    <button data-tab="journal"><span>📖</span>יומן</button>
    <button data-tab="guide"><span>💡</span>טיפים</button>
  </nav>

  <div id="modal" class="modal" hidden>
    <div class="modal-backdrop" data-close></div>
    <div class="modal-card" role="dialog" aria-modal="true">
      <button class="modal-x" data-close aria-label="סגירה">✕</button>
      <div id="modalBody"></div>
    </div>
  </div>

  <div id="celebrate" class="celebrate" aria-hidden="true"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="auth.js"></script>
  <script src="data.js"></script>
  <script src="content.js"></script>
  <script src="app.js"></script>
  <script src="onboarding.js"></script>
</body>
</html>
